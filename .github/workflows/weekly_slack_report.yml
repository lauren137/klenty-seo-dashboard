name: Weekly SEO Slack Report

on:
  schedule:
    # Tuesday 09:00 IST primary, with backups at 10:00 and 11:00 IST.
    # GitHub's free-tier scheduler can silently skip cron runs during peak load;
    # the backups ensure delivery. The Python script's first-run guard prevents duplicates.
    - cron: "30 3 * * 2"   # 09:00 IST
    - cron: "30 4 * * 2"   # 10:00 IST (backup #1)
    - cron: "30 5 * * 2"   # 11:00 IST (backup #2)
  workflow_dispatch:  # Manual "Run workflow" button in the Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          pip install --upgrade pip
          pip install \
            google-analytics-data \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run weekly report
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          # Dedup guard: skip if another scheduled run today already succeeded
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_ID: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python weekly_report.py
